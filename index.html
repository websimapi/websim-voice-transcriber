<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Transcriber</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Voice Transcriber</h1>
            <p>Record your voice and see real-time transcription</p>
        </div>
        
        <div class="main-content">
            <div class="controls">
                <button id="recordBtn" class="record-btn">
                    <div class="mic-icon">🎤</div>
                    <span class="btn-text">Start Recording</span>
                </button>
            </div>
            
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="statusText">Ready to record</span>
            </div>
            
            <div class="transcript-container">
                <div class="transcript-header">
                    <h3>Live Transcript</h3>
                    <button id="clearBtn" class="clear-btn">Clear</button>
                </div>
                <div id="transcript" class="transcript">
                    <div class="placeholder">Your speech will appear here...</div>
                </div>
            </div>
            
            <div class="audio-visualizer">
                <canvas id="visualizer" width="300" height="100"></canvas>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>

</body>
</html>
